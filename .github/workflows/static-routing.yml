name: Verify wiki static routing

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'package.json'
      - 'scripts/**'
      - 'assets/wiki.js'
      - '.github/workflows/static-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build wiki and verify Cloudflare routing
        run: npm run check:cloudflare
      - name: Validate SEO metadata and translations
        run: npm run test:seo
