name: Verify wiki static routing

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'package.json'
      - 'scripts/**'
      - 'assets/wiki.js'
      - 'assets/wiki-admin-v4.js'
      - 'assets/wiki-admin-v8.css'
      - 'assets/wiki-search-telemetry.js'
      - 'assets/wiki-admin-v5.js'
      - 'pokemons-exclusives/baby-legends.md'
      - 'fr-FR/pokemons-exclusives/baby-legends.md'
      - '.github/workflows/static-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate V8 auth gateway and syntax
        run: npm run test:admin-v8 && node --check scripts/worker-entry-v8.mjs && node --check assets/wiki-admin-v4.js
      - name: Build wiki and verify Cloudflare routing
        run: npm run check:cloudflare
      - name: Validate search quality and complete Baby Legends index
        run: npm run test:search-quality
      - name: Validate SEO metadata and translations
        run: npm run test:seo
